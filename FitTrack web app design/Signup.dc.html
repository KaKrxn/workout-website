<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ft-theme.css">
<style>
  .ft-input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--ft-accent) !important; }
  .ft-btn { transition: transform .12s, filter .15s; }
  .ft-btn:hover { filter: brightness(1.06); }
  .ft-btn:active { transform: translateY(1px); }
</style>
</helmet>
<div style="position:relative;min-height:100vh;width:100%;color:var(--ft-text)">
  <header style="position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(16px,3vw,36px) clamp(16px,4vw,59px) 0;flex-wrap:wrap;row-gap:14px">
    <a href="Landing.dc.html" style="display:flex;align-items:center;gap:20px;color:var(--ft-text)">
      <span style="width:clamp(44px,6vw,64px);height:clamp(44px,6vw,64px);border-radius:clamp(11px,1.4vw,15px);background:var(--ft-accent);flex:none"></span>
      <span style="font-size:clamp(30px,3.4vw,44px);font-weight:700;letter-spacing:-.01em">FitTrack</span>
    </a>
    <div style="display:flex;align-items:center;gap:clamp(8px,1.2vw,14px);flex-wrap:wrap">
      <div role="group" aria-label="language" style="position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:50px;background:var(--ft-input);box-shadow:inset 0 0 0 1px var(--ft-line)"><span aria-hidden="true" style="{{ langIndStyle }}"><span ref="{{ langBlobRef }}" style="display:block;width:100%;height:100%;border-radius:50px;background:var(--ft-accent)"></span></span>
        <button onClick="{{ setTh }}" style="{{ thStyle }}">TH</button>
        <button onClick="{{ setEn }}" style="{{ enStyle }}">EN</button>
      </div>
      <button onClick="{{ toggleTheme }}" aria-label="toggle theme" style="display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 16px;border:0;border-radius:50px;background:var(--ft-input);box-shadow:inset 0 0 0 1px var(--ft-line);color:var(--ft-text);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">
        <span>{{ themeLabel }}</span>
        <span style="position:relative;width:52px;height:28px;border-radius:50px;background:var(--ft-track);flex:none">
          <span ref="{{ knobRef }}" style="position:absolute;top:3px;left:{{ knobLeft }};width:22px;height:22px;border-radius:50%;background:var(--ft-accent);box-shadow:0 2px 6px rgba(0,0,0,.28);transition:left .55s cubic-bezier(.34,1.56,.64,1)"><svg viewBox="0 0 24 24" fill="#0b1a10" style="{{ moonStyle }}"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg><svg viewBox="0 0 24 24" fill="none" stroke="#0b1a10" stroke-width="2.6" stroke-linecap="round" style="{{ sunStyle }}"><circle cx="12" cy="12" r="4.2" fill="#0b1a10" stroke="none"></circle><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8"></path></svg></span>
        </span>
      </button>
      <a href="Landing.dc.html" style="font-size:22px;font-weight:700;color:var(--ft-text);margin-left:4px">{{ homeLabel }}</a>
    </div>
  </header>

  <main style="position:relative;z-index:2;display:flex;justify-content:center;padding:clamp(24px,5vh,64px) clamp(12px,3vw,20px) 60px">
    <section style="width:100%;max-width:650px;border-radius:20px;background:color-mix(in srgb, var(--ft-card) 71%, transparent);box-shadow:inset 0 0 0 1px var(--ft-line);padding:32px clamp(24px,6vw,70px) 40px">
      <div style="font-size:24px;font-weight:700;color:var(--ft-accent-strong)">GET STARTED</div>
      <h1 style="font-size:clamp(38px,5vw,48px);font-weight:700;text-align:center;margin:18px 0 6px">Create Account</h1>
      <p style="font-size:16px;font-weight:200;text-align:center;margin:0 0 34px">{{ subtitle }}</p>

      <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column">
        <label style="font-size:16px;font-weight:700;margin-bottom:8px">Name</label>
        <input class="ft-input" type="text" placeholder="Enter Name" style="width:100%;height:50px;border:0;border-radius:15px;background:var(--ft-input);box-shadow:inset 0 0 0 1px var(--ft-line);color:var(--ft-text);font-size:16px;font-family:inherit;font-weight:500;padding:0 22px">

        <label style="font-size:16px;font-weight:700;margin:24px 0 8px">Email</label>
        <input class="ft-input" type="email" placeholder="Enter Email" style="width:100%;height:50px;border:0;border-radius:15px;background:var(--ft-input);box-shadow:inset 0 0 0 1px var(--ft-line);color:var(--ft-text);font-size:16px;font-family:inherit;font-weight:500;padding:0 22px">

        <label style="font-size:16px;font-weight:700;margin:24px 0 8px">Password</label>
        <div style="position:relative">
          <input class="ft-input" type="{{ pwType }}" placeholder="Enter Password" style="width:100%;height:50px;border:0;border-radius:15px;background:var(--ft-input);box-shadow:inset 0 0 0 1px var(--ft-line);color:var(--ft-text);font-size:16px;font-family:inherit;font-weight:500;padding:0 56px 0 22px">
          <button type="button" onClick="{{ toggleEye }}" aria-label="show password" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;cursor:pointer;padding:0;opacity:.8;background:url(assets/eye-icon.png) center/100% 100% no-repeat;filter:var(--ft-icon-filter)"></button>
        </div>
        <span style="font-size:12px;font-weight:300;margin:8px 0 0 12px">Use at least 8 characters.</span>

        <label style="display:flex;align-items:center;gap:14px;margin:28px 6px 22px;cursor:pointer;font-size:16px;font-weight:500;flex-wrap:wrap">
          <button type="button" role="checkbox" aria-checked="{{ agree }}" onClick="{{ toggleAgree }}" style="{{ boxStyle }}"><span style="{{ tickStyle }}"></span></button>
          <span>I agree to the <a href="Signup.dc.html" style="font-weight:700">Terms &amp; Conditions</a> and <a href="Signup.dc.html" style="font-weight:700">Privacy Policy</a></span>
        </label>

        <button class="ft-btn" type="submit" style="height:70px;border:0;border-radius:15px;background:var(--ft-accent);color:#000;font-family:inherit;font-size:clamp(26px,4vw,34px);font-weight:700;cursor:pointer;opacity:{{ submitOpacity }}">Sign Up</button>
      </form>

      <div style="display:flex;align-items:center;gap:16px;margin:18px 0">
        <span style="flex:1;height:1px;background:var(--ft-text);opacity:.5"></span>
        <span style="font-size:24px;font-weight:700">OR</span>
        <span style="flex:1;height:1px;background:var(--ft-text);opacity:.5"></span>
      </div>

      <a class="ft-btn" href="App.dc.html#today" style="display:flex;align-items:center;justify-content:center;position:relative;height:70px;border-radius:15px;background:var(--ft-google);box-shadow:inset 0 0 0 1px var(--ft-google-line);color:var(--ft-google-text)">
        <span style="position:absolute;left:clamp(14px,3vw,26px);top:50%;transform:translateY(-50%);width:clamp(36px,5vw,47px);height:clamp(36px,5vw,47px);background:url(assets/google-icon.png) center/contain no-repeat"></span>
        <span style="font-size:clamp(26px,4vw,34px);font-weight:700">Google</span>
      </a>

      <p style="text-align:center;margin:24px 0 0;font-size:16px;font-weight:700">{{ haveAccount }} <a href="Login.dc.html">Log in</a></p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  state = { ready: false, theme: 'dark', locale: 'th', showPw: false, agree: false };
  async componentDidMount() {
    this.app = await import(new URL('app.js', location.href).href); window.addEventListener('ft-locale', e => this.setState({ locale: e.detail })); window.addEventListener('ft-theme', e => this.setState({ theme: e.detail }));
    this.app.bootTheme();
    this.setState({ ready: true, theme: this.app.getTheme(), locale: this.app.getLocale() });
  }
  submit = (e) => { e.preventDefault(); if (!this.state.agree) return; location.href = 'App.dc.html#today'; };

  knobRef = el => { this.knobEl = el; };
  langBlobRef = el => { this.langBlob = el; };
  pulseEl(el, sx) {
    if (!el || !el.animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    el.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(' + sx + ',' + (2 - sx * 0.75) + ')', offset: .45 }, { transform: 'scale(1,1)' }], { duration: 520, easing: 'cubic-bezier(.3,.7,.3,1)' });
  }
  toggleStyles(en, dark) {
    const spring = 'cubic-bezier(.34,1.56,.64,1)';
    const ic = on => ({ position: 'absolute', inset: 0, margin: 'auto', width: '14px', height: '14px', opacity: on ? 1 : 0, transform: on ? 'rotate(0deg) scale(1)' : 'rotate(-120deg) scale(.3)', transition: 'opacity .25s, transform .55s ' + spring });
    return {
      langIndStyle: { position: 'absolute', top: '4px', bottom: '4px', left: '4px', width: 'calc(50% - 4px)', transform: en ? 'translateX(100%)' : 'translateX(0)', transition: 'transform .55s ' + spring, pointerEvents: 'none', zIndex: 0 },
      moonStyle: ic(dark), sunStyle: ic(!dark), knobRef: this.knobRef, langBlobRef: this.langBlobRef,
    };
  }
  toggleTheme = (e) => { const t = this.state.theme === 'dark' ? 'light' : 'dark'; this.pulseEl(this.knobEl, 1.5); this.setState({ theme: t }); this.app.switchTheme(t, e && e.currentTarget); };
  setLang(l) { if (l === this.state.locale) return; this.pulseEl(this.langBlob, 1.4); this.setState({ locale: l }); this.app.switchLocale(l); }
  pill(active) { return { position: 'relative', zIndex: 1, height: '36px', minWidth: '46px', padding: '0 12px', border: 0, borderRadius: '50px', background: 'transparent', color: active ? 'var(--ft-on-accent)' : 'var(--ft-muted)', fontFamily: 'inherit', fontSize: '14px', fontWeight: 700, cursor: 'pointer', transition: 'color .3s' }; }
  renderVals() {
    const en = this.state.locale === 'en'; const dark = this.state.theme === 'dark'; const a = this.state.agree;
    return { ...this.toggleStyles(en, dark),
      thStyle: this.pill(!en), enStyle: this.pill(en), setTh: () => this.setLang('th'), setEn: () => this.setLang('en'),
      toggleTheme: this.toggleTheme, themeLabel: dark ? (en ? 'Dark' : 'มืด') : (en ? 'Light' : 'สว่าง'), knobLeft: dark ? '26px' : '4px',
      homeLabel: en ? 'Home' : 'หน้าแรก',
      subtitle: en ? 'Start your fitness journey with FitTrack.' : 'เริ่มต้นเส้นทางฟิตเนสของคุณกับ FitTrack',
      pwType: this.state.showPw ? 'text' : 'password', toggleEye: () => this.setState({ showPw: !this.state.showPw }),
      agree: a, toggleAgree: () => this.setState({ agree: !a }),
      boxStyle: { width: '27px', height: '27px', flex: 'none', border: 0, borderRadius: '5px', cursor: 'pointer', padding: 0, display: 'grid', placeItems: 'center', background: a ? 'var(--ft-accent)' : 'transparent', boxShadow: a ? 'none' : 'inset 0 0 0 2px var(--ft-text)' },
      tickStyle: { width: '16px', height: '16px', background: 'url(assets/check-icon.png) center/contain no-repeat', opacity: a ? 1 : 0 },
      submitOpacity: a ? '1' : '.55', submit: this.submit,
      haveAccount: en ? 'Already have an account?' : 'มีบัญชีอยู่แล้ว?',
    };
  }
}
</script>
</body>
</html>
